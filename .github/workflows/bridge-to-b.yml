name: PR bridge - B is source of truth
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed, ready_for_review]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: b-authoritative-pr-bridge
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'Vihnnnn/bot-bridge-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Create token restricted to B lab repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          client-id: ${{ vars.BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          owner: TF4-Phase3-TechX
          repositories: bot-bridge-lab
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Reconcile PRs and accepted main history
        env:
          SOURCE_TOKEN: ${{ github.token }}
          BRIDGE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/pr-bridge.mjs
